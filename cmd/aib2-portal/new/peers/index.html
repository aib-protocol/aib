<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIB 2.0 - Network Peers</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        .nav { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .nav a { color: #555; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .nav a:hover { color: #00d4ff; }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { color: #666; font-size: 1.1rem; }

        /* 统计卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            color: #666;
            font-size: 0.85rem;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 地球动画 */
        .globe-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .globe {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a3a5c, #0a1628);
            border: 2px solid #00d4ff30;
            position: relative;
            animation: pulse 3s ease-in-out infinite;
            box-shadow: 0 0 60px #00d4ff15, inset 0 0 40px #00d4ff10;
        }
        .globe::before {
            content: '';
            position: absolute;
            top: 10%; left: 10%; right: 10%; bottom: 10%;
            border-radius: 50%;
            border: 1px solid #00d4ff20;
        }
        .globe::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            width: 1px; height: 100%;
            background: linear-gradient(transparent, #00d4ff30, transparent);
        }
        .globe-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 260px; height: 80px;
            border: 1px solid #00d4ff20;
            border-radius: 50%;
            animation: rotate 8s linear infinite;
        }
        .globe-ring:nth-child(2) {
            width: 240px; height: 120px;
            animation-duration: 12s;
            animation-direction: reverse;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 60px #00d4ff15, inset 0 0 40px #00d4ff10; }
            50% { box-shadow: 0 0 80px #00d4ff25, inset 0 0 60px #00d4ff15; }
        }
        @keyframes rotate { from { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(0deg); } to { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(360deg); } }

        /* 节点列表 */
        .peer-grid {
            display: grid;
            gap: 16px;
        }
        .peer-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
            transition: all 0.3s ease;
        }
        .peer-card:hover {
            border-color: #00d4ff40;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.1);
        }

        .peer-status {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff8860;
            animation: blink 2s ease-in-out infinite;
        }
        .peer-status.offline {
            background: #ff4444;
            box-shadow: 0 0 10px #ff444460;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .peer-info { min-width: 0; }
        .peer-address {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: #00d4ff;
            word-break: break-all;
        }
        .peer-meta {
            display: flex;
            gap: 20px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #555;
        }
        .peer-meta span { display: flex; align-items: center; gap: 4px; }

        .peer-badge {
            background: linear-gradient(135deg, #00d4ff20, #7b2ff720);
            border: 1px solid #00d4ff30;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #00d4ff;
            white-space: nowrap;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #444;
        }
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty-state h3 { color: #555; margin-bottom: 10px; }
        .empty-state p { font-size: 0.9rem; max-width: 400px; margin: 0 auto; }
        .empty-state code {
            display: inline-block;
            background: #1a1a2e;
            padding: 8px 16px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'JetBrains Mono', monospace;
            color: #00ff88;
            font-size: 0.85rem;
        }

        /* 刷新按钮 */
        .refresh-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .refresh-bar h2 {
            font-size: 1.3rem;
            color: #aaa;
        }
        .refresh-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #888;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            border-color: #00d4ff;
            color: #00d4ff;
        }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .last-updated {
            text-align: center;
            color: #333;
            font-size: 0.75rem;
            margin-top: 30px;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
        }
        .loading-dots span {
            display: inline-block;
            width: 10px; height: 10px;
            margin: 0 4px;
            background: #00d4ff;
            border-radius: 50%;
            animation: loadBounce 1.4s ease-in-out infinite both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loadBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">Home</a>
            <a href="/en/quickstart">Quick Start</a>
            <a href="/en/genesis">Genesis</a>
            <a href="/en/constitution">Constitution</a>
            <a href="/peers" style="color:#00d4ff;">Peers</a>
        </div>

        <div class="header">
            <h1>AIB 2.0 Network</h1>
            <p>Live view of all connected nodes</p>
        </div>

        <!-- 地球动画 -->
        <div class="globe-section">
            <div class="globe">
                <div class="globe-ring"></div>
                <div class="globe-ring"></div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="peer-count">-</div>
                <div class="stat-label">Connected Peers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="block-height">-</div>
                <div class="stat-label">Block Height</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uptime">-</div>
                <div class="stat-label">Node Uptime</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="network-status">-</div>
                <div class="stat-label">Network Status</div>
            </div>
        </div>

        <!-- 节点列表 -->
        <div class="refresh-bar">
            <h2>Connected Nodes</h2>
            <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
        </div>

        <div id="peer-list">
            <div class="loading">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <p style="color:#444;margin-top:15px;">Loading network peers...</p>
            </div>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        function formatUptime(str) {
            if (!str) return '-';
            const h = str.match(/(\d+)h/);
            const m = str.match(/(\d+)m/);
            if (h) return h[1] + 'h ' + (m ? m[1] + 'm' : '');
            if (m) return m[1] + 'm';
            return str.split('.')[0] + 's';
        }

        function timeAgo(dateStr) {
            const now = new Date();
            const then = new Date(dateStr);
            const secs = Math.floor((now - then) / 1000);
            if (secs < 60) return secs + 's ago';
            if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
            return Math.floor(secs / 86400) + 'd ago';
        }

        function renderPeers(peers) {
            const el = document.getElementById('peer-list');

            if (!peers || peers.length === 0) {
                el.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🌐</div>
                        <h3>No peers connected yet</h3>
                        <p>Be the first to join the AIB 2.0 testnet! Install a node and it will appear here.</p>
                        <code>curl -sL https://www.aib.one/install.sh | bash</code>
                    </div>`;
                return;
            }

            el.innerHTML = peers.map((peer, i) => `
                <div class="peer-card" style="animation: fadeIn 0.3s ease ${i * 0.05}s both;">
                    <div class="peer-status ${peer.connected ? '' : 'offline'}"></div>
                    <div class="peer-info">
                        <div class="peer-address">${peer.address || peer.id}</div>
                        <div class="peer-meta">
                            <span>ID: ${peer.id ? peer.id.substring(0, 16) + '...' : 'unknown'}</span>
                            <span>Last seen: ${peer.last_seen ? timeAgo(peer.last_seen) : 'now'}</span>
                        </div>
                    </div>
                    <div class="peer-badge">${peer.connected ? '● Online' : '○ Offline'}</div>
                </div>
            `).join('');
        }

        async function refresh() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '↻ Loading...';

            try {
                // 获取节点状态
                const statusRes = await fetch('/v1/status');
                if (statusRes.ok) {
                    const status = await statusRes.json();
                    if (status.success) {
                        document.getElementById('block-height').textContent = status.data.block_height.toLocaleString();
                        document.getElementById('uptime').textContent = formatUptime(status.data.uptime);
                        document.getElementById('network-status').textContent = status.data.sync_status === 'synced' ? '● Live' : '○ Syncing';
                        document.getElementById('network-status').style.color = status.data.sync_status === 'synced' ? '#00ff88' : '#ffaa00';
                    }
                }

                // 获取节点列表
                const peersRes = await fetch('/v1/peers');
                if (peersRes.ok) {
                    const data = await peersRes.json();
                    if (data.success) {
                        document.getElementById('peer-count').textContent = data.data.total;
                        renderPeers(data.data.peers);
                    }
                }

                document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            } catch (e) {
                document.getElementById('peer-count').textContent = '?';
                document.getElementById('network-status').textContent = '● Offline';
                document.getElementById('network-status').style.color = '#ff4444';
                renderPeers([]);
            }

            btn.textContent = '↻ Refresh';
        }

        // 初始加载
        refresh();

        // 每 10 秒自动刷新
        setInterval(refresh, 10000);

        // fadeIn 动画
        const style = document.createElement('style');
        style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }';
        document.head.appendChild(style);
    </script>
</body>
</html>
