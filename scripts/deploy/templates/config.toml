# AIB 2.0 Deployment Configuration
# Copy this file to config.toml and customize

# ========== node configuration ==========
[node]
  # node name
  moniker = "aib-mainnet-validator"
  # node type: validator, full, light
  node_type = "validator"
  # data directory
  data_dir = "./data"
  # log level: debug, info, warn, error
  log_level = "info"

# ========== API configuration ==========
[api]
  # API listen address
  listen_address = "0.0.0.0:51200"
  # enable API
  enabled = true
  # allow CORS
  enable_cors = true
  # API rate limit (req/s)
  rate_limit = 100
  # max request body size (bytes)
  max_body_size = 1048576

# ========== P2P configuration ==========
[p2p]
  # P2P listen address
  listen_address = "0.0.0.0:26656"
  # external address (public IP:port)
  external_address = ""
  # seed nodes (format: node_id@ip:port)
  seeds = []
  # persistent nodes
  persistent_peers = []
  # max connections
  max_connections = 100
  # max peers
  max_peers = 50

# ========== consensus configuration ==========
[consensus]
  # block time (seconds)
  block_time = 60
  # validator address list
  validators = []
  # minimum stake amount
  min_stake = "1000000"
  # unbonding time (seconds)
  unbonding_time = 604800
  # proposer reward ratio
  proposer_reward = 0.01

# ========== genesis configuration ==========
[genesis]
  # chain ID
  chain_id = "aib-mainnet-1"
  # genesis file path
  genesis_file = "./config/genesis.json"

# ========== monitoring configuration ==========
[telemetry]
  # enable telemetry
  enabled = true
  # Prometheus port
  prometheus_port = 26660
  # enable Pprof
  pprof_enabled = true
  # Pprof port
  pprof_port = 26661

# ========== RPC configuration ==========
[rpc]
  # RPC listen address
  listen_address = "0.0.0.0:26657"
  # enable RPC
  enabled = true
  # allow CORS
  cors_allowed_origins = ["*"]

# ========== wallet configuration ==========
[wallet]
  # wallet directory
  keystore_path = "./data/keystore"
  # default account
  default_account = ""
  # unlock timeout (seconds)
  unlock_timeout = 300

# ========== EVM configuration ==========
[evm]
  # enable EVM  enabled = true

  # EVM chain ID
  chain_id = 9527
  # EVM network ID
  network_id = 9527

# ========== performance configuration ==========
[performance]
  # cache size (MB)
  cache_size = 512
  # concurrency
  concurrent_tx = 100
  # block buffer size
  block_buffer = 10
